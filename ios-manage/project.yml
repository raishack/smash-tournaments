# Generated by scripts/configure.mjs. Signing team is set in your own Xcode.
name: TournamentManager
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  TournamentManager:
    type: application
    platform: iOS
    sources:
      - path: TournamentManagerIOS
        excludes:
          - AppIcon
          - AppIcon.appiconset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tournamentmanager.ios
        PRODUCT_NAME: TournamentManager
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Smash Tournaments"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.example.tournamentmanager.ios
            CFBundleURLSchemes:
              - tournamentmanager
